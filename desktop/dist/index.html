<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SnapBot</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid; place-items: center;
    background: radial-gradient(120% 120% at 50% 0%, #1b2a4a 0%, #0d1526 55%, #080d18 100%);
    color: #dce6f7;
    font: 15px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
  }
  .card { width: min(560px, 88vw); text-align: center; }
  .logo {
    width: 76px; height: 76px; margin: 0 auto 22px;
    border-radius: 22px;
    background: linear-gradient(145deg, #4f8cff, #17b6d9);
    box-shadow: 0 18px 44px rgba(23, 182, 217, .28);
  }
  h1 { margin: 0 0 6px; font-size: 21px; font-weight: 600; letter-spacing: .3px; }
  #msg { margin: 0; color: #8ba3c7; font-size: 14px; min-height: 22px; }
  .bar {
    margin: 26px auto 0; width: 100%; height: 4px; border-radius: 999px;
    background: rgba(140, 170, 215, .16); overflow: hidden;
  }
  .bar > i {
    display: block; height: 100%; width: 34%; border-radius: 999px;
    background: linear-gradient(90deg, #4f8cff, #17b6d9);
    animation: slide 1.25s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(360%); }
  }
  .err {
    display: none; margin-top: 22px; padding: 14px 16px; text-align: left;
    background: rgba(255, 92, 92, .09); border: 1px solid rgba(255, 92, 92, .32);
    border-radius: 12px; color: #ffc9c9; font-size: 13px;
    white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto;
  }
  .err.show { display: block; }
  button {
    display: none; margin: 18px auto 0; padding: 9px 26px; cursor: pointer;
    border: 0; border-radius: 9px; font-size: 14px; color: #06121f;
    background: linear-gradient(145deg, #7fb0ff, #17b6d9);
  }
  button.show { display: block; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>SnapBot</h1>
    <p id="msg">正在启动本地服务…</p>
    <div class="bar" id="bar"><i></i></div>
    <div class="err" id="err"></div>
    <button id="retry">重试</button>
  </div>

<script>
(function () {
  var msg   = document.getElementById('msg');
  var bar   = document.getElementById('bar');
  var err   = document.getElementById('err');
  var retry = document.getElementById('retry');
  var started = Date.now();

  function invoke(cmd) {
    var g = window.__TAURI__;
    if (!g) return Promise.reject(new Error('Tauri 桥接不可用'));
    var core = g.core || g;
    if (!core || typeof core.invoke !== 'function') {
      return Promise.reject(new Error('Tauri core.invoke 不可用'));
    }
    return core.invoke(cmd);
  }

  function elapsed() {
    return Math.round((Date.now() - started) / 1000);
  }

  function fail(text) {
    bar.style.display = 'none';
    msg.textContent = '启动失败';
    err.textContent = text;
    err.classList.add('show');
    retry.classList.add('show');
  }

  function poll() {
    invoke('bootstrap_status').then(function (s) {
      if (s && s.failed) {
        fail(s.error || '未知错误');
        return;
      }
      if (s && s.ready && s.url) {
        msg.textContent = '正在打开界面…';
        window.location.replace(s.url);
        return;
      }
      msg.textContent = '正在启动本地服务…（已等待 ' + elapsed() + ' 秒）';
      setTimeout(poll, 400);
    }).catch(function (e) {
      fail('与桌面壳通信失败：' + (e && e.message ? e.message : e));
    });
  }

  retry.addEventListener('click', function () {
    retry.disabled = true;
    err.classList.remove('show');
    retry.classList.remove('show');
    bar.style.display = '';
    msg.textContent = '正在重试…';
    started = Date.now();
    invoke('bootstrap_retry').catch(function () {});
    setTimeout(function () { retry.disabled = false; poll(); }, 300);
  });

  poll();
})();
</script>
</body>
</html>
