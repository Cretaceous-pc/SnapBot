[package]
name = "snapbot-desktop"
version = "0.0.1"
description = "SnapBot — nanobot 的 Windows 桌面外壳"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: 托盘图标与菜单
# image-png: 从 bytes 构造托盘图标（我们复用 icons/icon.png）
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "snapbot-desktop"
path = "src/main.rs"
