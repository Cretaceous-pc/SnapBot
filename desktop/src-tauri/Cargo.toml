[package]
name = "snapbot-desktop"
version = "0.1.0"
description = "SnapBot — nanobot 的 Windows 桌面外壳"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "snapbot-desktop"
path = "src/main.rs"
